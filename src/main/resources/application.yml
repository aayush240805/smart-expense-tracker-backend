spring:
  application:
    name: smart-expense-tracker

  datasource:
    url: jdbc:mysql://localhost:3306/smart_expense_tracker
    username: root
    password: mydbms

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${SECRET_KEY}
  expiration: ${EXPIRATION}

server:
  port: 8080

#logging:
#  level:
#    com:
#      expensetracker: INFO

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG


