spring:
  application:
    name: smart-expense-tracker

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_expense_tracker}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

jwt:
  secret: ${SECRET_KEY}
  expiration: ${EXPIRATION}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}

  OAuth2-redirect-success-url: ${REDIRECT_SUCCESS_URL:http://localhost:5173/oauth2/redirect?token=}
  OAuth2-redirect-failure-url: ${REDIRECT_FAILURE_URL:http://localhost:5173/login?error=oauth2_cancelled}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN